name: Manage Databases

on:
  push:
    paths:
      - "manage-databases/**"
      - ".github/workflows/manage-databases.yml"
  pull_request:
    paths:
      - "manage-databases/**"
      - ".github/workflows/manage-databases.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AGENT_DB_DIRECTORY: manage-databases/scripts/agent-db
  NODE_VERSION: "20.19.0"

jobs:
  portability:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.AGENT_DB_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.AGENT_DB_DIRECTORY }}
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: ${{ env.AGENT_DB_DIRECTORY }}
        run: npm run check

      - name: Run unit and platform tests
        working-directory: ${{ env.AGENT_DB_DIRECTORY }}
        run: npm test

      - name: Run CLI entrypoint
        working-directory: ${{ env.AGENT_DB_DIRECTORY }}
        run: node ./bin/agent-db.js --help

  integration:
    name: Live ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgresql
            image: postgres:17-alpine
            port: 5432
            username: agentdb
            password: agentdb-ci-password
            database: agentdb
          - engine: mongodb
            image: mongo:7.0
            port: 27017
            username: agentdb
            password: agentdb-ci-password
            database: agentdb
          - engine: sqlserver
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            username: sa
            password: AgentDb-CI-Password1!
            database: master
          - engine: oracle
            image: gvenzl/oracle-free:23-slim-faststart
            port: 1521
            username: agentdb
            password: AgentDb-CI-Password1!
            database: FREEPDB1
          - engine: redis
            image: redis:8.0-alpine
            port: 6379
            username: default
            password: unused
            database: "0"

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: agentdb
          POSTGRES_PASSWORD: agentdb-ci-password
          POSTGRES_DB: agentdb
          MONGO_INITDB_ROOT_USERNAME: agentdb
          MONGO_INITDB_ROOT_PASSWORD: agentdb-ci-password
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: AgentDb-CI-Password1!
          ORACLE_PASSWORD: AgentDb-CI-Password1!
          APP_USER: agentdb
          APP_USER_PASSWORD: AgentDb-CI-Password1!
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.AGENT_DB_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.AGENT_DB_DIRECTORY }}
        run: npm ci

      - name: Smoke test live adapter
        working-directory: ${{ env.AGENT_DB_DIRECTORY }}
        env:
          AGENT_DB_TEST_ENGINE: ${{ matrix.engine }}
          AGENT_DB_TEST_HOST: 127.0.0.1
          AGENT_DB_TEST_PORT: ${{ matrix.port }}
          AGENT_DB_TEST_USERNAME: ${{ matrix.username }}
          AGENT_DB_TEST_PASSWORD: ${{ matrix.password }}
          AGENT_DB_TEST_DATABASE: ${{ matrix.database }}
        run: npm run test:integration

  validate-skill:
    name: Validate skill structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Check out the official skill validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .codex-system-skills
          sparse-checkout: skills/.system/skill-creator/scripts/quick_validate.py
          sparse-checkout-cone-mode: false

      - name: Validate manage-databases skill
        run: python .codex-system-skills/skills/.system/skill-creator/scripts/quick_validate.py manage-databases
