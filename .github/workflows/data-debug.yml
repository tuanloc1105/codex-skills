name: Data Debug

on:
  push:
    paths:
      - "data-debug/**"
      - ".github/workflows/data-debug.yml"
      - "global/AGENTS.md"
      - "global/windows/AGENTS.md"
      - "docs/agent/skill-maintenance.md"
  pull_request:
    paths:
      - "data-debug/**"
      - ".github/workflows/data-debug.yml"
      - "global/AGENTS.md"
      - "global/windows/AGENTS.md"
      - "docs/agent/skill-maintenance.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_DEBUG_DIRECTORY: data-debug/scripts/data-debug
  NODE_VERSION: "22"

jobs:
  portability:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.DATA_DEBUG_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.DATA_DEBUG_DIRECTORY }}
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: ${{ env.DATA_DEBUG_DIRECTORY }}
        run: npm run check

      - name: Run unit and platform tests
        working-directory: ${{ env.DATA_DEBUG_DIRECTORY }}
        run: npm test

      - name: Run CLI entrypoint
        working-directory: ${{ env.DATA_DEBUG_DIRECTORY }}
        run: node ./bin/data-debug.js --help

  integration:
    name: Live ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgresql
            image: postgres:17-alpine
            port: 5432
            username: data_debug
            password: data-debug-ci-password
            database: data_debug
          - engine: mongodb
            image: mongo:7.0
            port: 27017
            username: data_debug
            password: data-debug-ci-password
            database: data_debug
          - engine: sqlserver
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            username: sa
            password: DataDebug-CI-Password1!
            database: master
          - engine: oracle
            image: gvenzl/oracle-free:23-slim-faststart
            port: 1521
            username: data_debug
            password: DataDebug-CI-Password1!
            database: FREEPDB1
          - engine: redis
            image: redis:8.0-alpine
            port: 6379
            username: default
            password: unused
            database: "0"

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: data_debug
          POSTGRES_PASSWORD: data-debug-ci-password
          POSTGRES_DB: data_debug
          MONGO_INITDB_ROOT_USERNAME: data_debug
          MONGO_INITDB_ROOT_PASSWORD: data-debug-ci-password
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: DataDebug-CI-Password1!
          ORACLE_PASSWORD: DataDebug-CI-Password1!
          APP_USER: data_debug
          APP_USER_PASSWORD: DataDebug-CI-Password1!
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.DATA_DEBUG_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.DATA_DEBUG_DIRECTORY }}
        run: npm ci

      - name: Prepare PostgreSQL smoke fixture
        if: matrix.engine == 'postgresql'
        env:
          DATABASE_CONTAINER_ID: ${{ job.services.database.id }}
        run: |
          until docker exec "$DATABASE_CONTAINER_ID" pg_isready -U data_debug -d data_debug; do sleep 2; done
          docker exec "$DATABASE_CONTAINER_ID" psql -U data_debug -d data_debug -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE IF NOT EXISTS public.data_debug_smoke (smoke_id varchar(64) PRIMARY KEY, smoke_value varchar(128) NOT NULL)'

      - name: Prepare SQL Server smoke fixture
        if: matrix.engine == 'sqlserver'
        env:
          DATABASE_CONTAINER_ID: ${{ job.services.database.id }}
        run: |
          until docker exec "$DATABASE_CONTAINER_ID" bash -lc '
            sqlcmd=/opt/mssql-tools18/bin/sqlcmd
            test -x "$sqlcmd" || sqlcmd=/opt/mssql-tools/bin/sqlcmd
            "$sqlcmd" -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -d master -Q "SELECT 1"
          '; do sleep 2; done
          docker exec "$DATABASE_CONTAINER_ID" bash -lc '
            sqlcmd=/opt/mssql-tools18/bin/sqlcmd
            test -x "$sqlcmd" || sqlcmd=/opt/mssql-tools/bin/sqlcmd
            "$sqlcmd" -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -d master -Q \
              "IF OBJECT_ID('"'"'dbo.data_debug_smoke'"'"', '"'"'U'"'"') IS NULL CREATE TABLE dbo.data_debug_smoke (smoke_id varchar(64) PRIMARY KEY, smoke_value varchar(128) NOT NULL)"
          '

      - name: Prepare Oracle smoke fixture
        if: matrix.engine == 'oracle'
        env:
          DATABASE_CONTAINER_ID: ${{ job.services.database.id }}
        run: |
          until printf '%s\n' 'SELECT 1 FROM DUAL;' 'EXIT' | docker exec -i "$DATABASE_CONTAINER_ID" \
            sqlplus -s 'data_debug/DataDebug-CI-Password1!@//localhost:1521/FREEPDB1'; do sleep 5; done
          printf '%s\n' \
            'WHENEVER SQLERROR EXIT SQL.SQLCODE' \
            "BEGIN EXECUTE IMMEDIATE 'CREATE TABLE DATA_DEBUG_SMOKE (SMOKE_ID VARCHAR2(64) PRIMARY KEY, SMOKE_VALUE VARCHAR2(128) NOT NULL)'; EXCEPTION WHEN OTHERS THEN IF SQLCODE != -955 THEN RAISE; END IF; END;" \
            '/' \
            'EXIT' | docker exec -i "$DATABASE_CONTAINER_ID" \
              sqlplus -s 'data_debug/DataDebug-CI-Password1!@//localhost:1521/FREEPDB1'

      - name: Smoke test live adapter
        working-directory: ${{ env.DATA_DEBUG_DIRECTORY }}
        env:
          DATA_DEBUG_TEST_ENGINE: ${{ matrix.engine }}
          DATA_DEBUG_TEST_HOST: 127.0.0.1
          DATA_DEBUG_TEST_PORT: ${{ matrix.port }}
          DATA_DEBUG_TEST_USERNAME: ${{ matrix.username }}
          DATA_DEBUG_TEST_PASSWORD: ${{ matrix.password }}
          DATA_DEBUG_TEST_DATABASE: ${{ matrix.database }}
        run: npm run test:integration

  validate-skill:
    name: Validate skill structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Check out the official skill validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .codex-system-skills
          sparse-checkout: skills/.system/skill-creator/scripts/quick_validate.py
          sparse-checkout-cone-mode: false

      - name: Validate data-debug skill
        run: python .codex-system-skills/skills/.system/skill-creator/scripts/quick_validate.py data-debug
