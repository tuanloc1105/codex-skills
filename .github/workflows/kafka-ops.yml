name: Kafka Ops

on:
  push:
    paths:
      - "kafka-ops/**"
      - "windows-powershell/**"
      - ".github/workflows/kafka-ops.yml"
  pull_request:
    paths:
      - "kafka-ops/**"
      - "windows-powershell/**"
      - ".github/workflows/kafka-ops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Check out the official skill validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .codex-system-skills
          sparse-checkout: skills/.system/skill-creator/scripts/quick_validate.py
          sparse-checkout-cone-mode: false

      - name: Verify Windows PowerShell hosts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Get-Command powershell.exe,pwsh.exe | Select-Object Name, Source, Version
          & powershell.exe -NoLogo -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw "powershell.exe failed with exit code $LASTEXITCODE" }
          & pwsh.exe -NoLogo -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw "pwsh.exe failed with exit code $LASTEXITCODE" }

      - name: Run Kafka guard unit and runner tests
        run: python kafka-ops/scripts/test_kafka_guard.py

      - name: Validate kafka-ops skill
        run: python .codex-system-skills/skills/.system/skill-creator/scripts/quick_validate.py kafka-ops

      - name: Validate windows-powershell skill
        run: python .codex-system-skills/skills/.system/skill-creator/scripts/quick_validate.py windows-powershell
