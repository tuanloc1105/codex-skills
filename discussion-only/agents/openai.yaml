interface:
  display_name: "Discussion Only"
  short_description: "Discuss with an auto-saved Markdown tracker"
  default_prompt: "Use $discussion-only to discuss this topic without source-code changes, pause at the first material user-owned decision, ask exactly one question with 2-4 options, and auto-save the tracker without asking storage questions."

policy:
  allow_implicit_invocation: false
