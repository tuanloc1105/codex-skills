interface:
  display_name: "Discuss"
  short_description: "Discuss, track, then choose plan or execute"
  default_prompt: "Use $discuss to keep a self-contained tracker with source provenance and an exact resume checkpoint, pause at the first material user-owned decision, and persist the tracker before every substantive response. If I request and confirm a bounded action that affects source code, perform and verify only that action, record its result, then automatically return to discuss. Keep discuss active until I transition with $plan or $execute; if I choose $execute, finalize the same file as an execution-ready handoff before exiting discuss."

policy:
  allow_implicit_invocation: false
