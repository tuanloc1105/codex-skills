interface:
  display_name: "Discuss"
  short_description: "Discuss, track, then choose plan or execute"
  default_prompt: "Use $discuss to keep one version 4 Markdown record bundle with index.md as its control plane. Synchronize the manifest at context boundaries, update bundle files through write transactions, checkpoint every turn, and pause at the first material user-owned decision. Keep discuss active until I transition with $plan or $execute."

policy:
  allow_implicit_invocation: false
