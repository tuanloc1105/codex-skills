interface:
  display_name: "Discuss"
  short_description: "Discuss, track, then choose plan or execute"
  default_prompt: "Use $discuss to keep one self-contained tracker with source provenance and an exact resume checkpoint. Read and synchronize that exact file at each context boundary, checkpoint every turn, pause at the first material user-owned decision, and persist it before every substantive response. If I request and confirm a bounded source-code action, perform and verify only that action, record its result, then return to discuss. Keep discuss active until I transition with $plan or $execute."

policy:
  allow_implicit_invocation: false
