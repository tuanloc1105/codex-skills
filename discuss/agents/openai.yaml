interface:
  display_name: "Discuss"
  short_description: "Discuss with an auto-saved Markdown tracker"
  default_prompt: "Use $discuss to discuss this topic without source-code changes, keep a self-contained tracker with source provenance and an exact resume checkpoint, pause at the first material user-owned decision, and persist the tracker before every substantive response. When I provide an existing tracker as a handoff, read it completely and continue that exact file."

policy:
  allow_implicit_invocation: false
