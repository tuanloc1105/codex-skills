interface:
  display_name: "Discuss"
  short_description: "Discuss, track, and hand off directly to execute"
  default_prompt: "Use $discuss to discuss this topic without source-code changes, keep a self-contained tracker with source provenance and an exact resume checkpoint, pause at the first material user-owned decision, and persist the tracker before every substantive response. When I provide an existing tracker as a handoff, read it completely and continue that exact file. If I invoke $execute against the active tracker, finalize the same file as an execution-ready handoff and exit discuss only after it is durable."

policy:
  allow_implicit_invocation: false
